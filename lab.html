<script>
(() => {
  const f = document.getElementById('secFrame');
  const exit = document.getElementById('secExit');
  let mode = null;
  function show(src, label, evt){
    const apply = () => {
      if (f.getAttribute('src') !== src) f.src = src;
      mode = label;
      f.classList.add('big'); f.style.pointerEvents = 'auto';
      document.body.classList.add('in-section');
      try { f.contentWindow.__resumeBianjing?.(); } catch(err){}
    };
    if (document.startViewTransition && evt){
      const x = (evt.clientX || innerWidth/2) + 'px';
      const y = (evt.clientY || innerHeight/2) + 'px';
      document.documentElement.style.setProperty('--vt-x', x);
      document.documentElement.style.setProperty('--vt-y', y);
      document.startViewTransition(apply);
    } else { apply(); }
  }
  function hide(){
    f.classList.remove('big'); f.style.pointerEvents = 'none';
    document.body.classList.remove('in-section');
    try { f.contentWindow.__pauseBianjing?.(); } catch(err){}
  }
  document.querySelectorAll('#siteTabs a.tab').forEach(a => {
    const href = a.getAttribute('href') || '';
    a.addEventListener('click', e => {
      e.preventDefault();
      if (href.includes('bianjing')) show('bianjing.html', 'bj', e);
      else if (href.includes('contact')) show('contact.html', 'ct', e);
      else if (href.includes('shichen')) show('shichen.html', 'sc', e);
      else if (href.includes('qinglv')) show('qinglv.html', 'qv', e);
      else hide();
    });
  });
  document.getElementById('crossNav')?.addEventListener('click', e => {
    e.preventDefault(); show('bianjing.html', 'bj', e);
  });
  exit.addEventListener('click', e => { e.preventDefault(); hide(); });
  // 空闲预载：8 秒后后台营造乐高汴京（小窗低透明度预热，点开时已近完成）
  setTimeout(() => { if (!mode) f.src = 'bianjing.html?preload=1'; }, 8000);
  // iframe 内回到实验室页 → 交还主文档
  f.addEventListener('load', () => {
    try {
      const p = f.contentWindow.location.pathname;
      if (p.endsWith('index.html') && mode){
        location.reload();
      }
    } catch(err){}
  });
})();

<script>
/* 流沙文字 —— vaanai 主站 Hero 粒子状态机移植（离屏纹理源，3D 面片采样）
   FORM(错峰弹簧+curl微扰+sprint) → HOLD(呼吸) → SCATTER(curl流场融化→转向新词)，全程无瞬移 */
(() => {
  const cv = document.getElementById('sandText');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0;
  const WORDS_D3 = [                              // 一阶段：三行海报式
    ['Vaan', 'Ai', 'Builder'],
    ['临床', '药学', '五年制'],
    ['深耕', 'IVD', '行业十年'],
    ['从零', '到一', '建部门'],
    ['积极', '拥抱', 'Ai'],
    ['以少', '胜多'],
    ['合规', '第一', '长期主义'],
  ];
  const WORDS_D2 = [                              // 二阶段 dock：两行原版
    ['Vaan'], ['Ai Builder'],
    ['临床药学', '五年制'],
    ['深耕 IVD', '行业十年'],
    ['从零到一', '建部门'],
    ['积极拥抱', 'Ai'],
    ['以少胜多'],
    ['合规第一', '长期主义'],
  ];
  let wordList = WORDS_D3;
  const COLORS = [
    [0,217,255],[108,92,231],[247,148,161],[255,202,87],
    [72,219,133],[159,122,237],[255,118,117],
  ];

  let activeN = 4200, SZ_SCALE = 1;
  const FIXED_N = 4200;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const landscape = innerWidth > innerHeight;
    W = Math.floor(innerWidth * (landscape ? 0.40 : innerWidth <= 860 ? 1 : 0.46));
    H = Math.floor(innerHeight * (landscape ? 1 : innerWidth <= 860 ? 0.44 : 1));
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (W < 480)      { activeN = 2400; SZ_SCALE = 0.45; }
    else if (W < 768) { activeN = 3200; SZ_SCALE = 0.55; }
    else              { activeN = FIXED_N; SZ_SCALE = 1; }
  }

  // 固定粒子池
  const particles = [];
  for (let i = 0; i < FIXED_N; i++) {
    particles.push({
      x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0,
      ease: 0.03 + Math.random() * 0.05,
      color: COLORS[i % COLORS.length],
      sz: 2.2 + Math.random() * 2.0,
      delay: Math.floor(Math.random() * 50),
      stiffness: 0.015 + Math.random() * 0.04,
    });
  }

  function getPoints(lines) {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const oc = off.getContext('2d');
    // 多行排版（主站方案）：长词拆行 → 每行字号不再被总宽压扁，面板填充率大增
    const font = s => `600 ${s}px -apple-system, "PingFang SC", sans-serif`;
    let fs = Math.min(Math.round(Math.min(W * 0.34, H * 0.46)), 140);
    oc.font = font(fs);
    let tw = Math.max(...lines.map(l => oc.measureText(l).width));
    if (tw > W * 0.82) { fs = Math.max(20, Math.floor(fs * W * 0.82 / tw)); oc.font = font(fs); }
    const LH = 1.28;
    if (fs * LH * lines.length > H * 0.92) {   // 总高溢出面板再压
      fs = Math.max(20, Math.floor(H * 0.92 / (LH * lines.length)));
      oc.font = font(fs);
    }
    oc.textAlign = 'center'; oc.textBaseline = 'middle';
    oc.fillStyle = '#fff';
    // ±0.7px 五次偏移绘制 → 笔画约加粗 1px（细横画不被采样网格整行漏掉）
    const OFF = [[0, 0], [-0.7, 0], [0.7, 0], [0, -0.7], [0, 0.7]];
    const y0 = H / 2 - (lines.length - 1) * fs * LH / 2;
    lines.forEach((ln, i) => {
      const y = y0 + i * fs * LH;
      for (const [dx, dy] of OFF) oc.fillText(ln, W / 2 + dx, y + dy);
    });
    const img = oc.getImageData(0, 0, W, H).data;
    // 自适应步长：点数 ≤ 0.9×activeN
    let step = 2, pts = [];
    do {
      pts = [];
      for (let py = 0; py < H; py += step)
        for (let px = 0; px < W; px += step)
          if (img[(py * W + px) * 4 + 3] > 60) pts.push(px, py);
      if (pts.length / 2 > activeN * 0.9) step++;
    } while (pts.length / 2 > activeN * 0.9 && step < 40);
    return pts;
  }

  function assignTargets() {
    const pts = getPoints(wordList[wordIdx]);
    if (!pts.length) return;
    const n = pts.length / 2;
    for (let i = 0; i < activeN; i++) {        // 多粒子堆叠同点 → 笔画粗实
      const k = (i % n) * 2;
      particles[i].tx = pts[k];
      particles[i].ty = pts[k + 1];
    }
  }

  // ── curl noise 流场（有机运动来源）──
  function h2(x, y) { return ((Math.sin(x * 127.1 + y * 311.7) * 43758.5453 % 1) + 1) % 1; }
  function n2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return h2(ix,iy)*(1-ux)*(1-uy)+h2(ix+1,iy)*ux*(1-uy)
         +h2(ix,iy+1)*(1-ux)*uy+h2(ix+1,iy+1)*ux*uy;
  }
  const curlFx = (x, y, t) => (n2(x, y + 0.4 + t) - n2(x, y - 0.4 + t)) / 0.8;
  const curlFy = (x, y, t) => -(n2(x + 0.4 + t, y) - n2(x - 0.4 + t, y)) / 0.8;

  const STATE = { FORM: 0, HOLD: 1, SCATTER: 2 };
  // ?word=N 可指定初始词（演示/调试直达）
  let state = STATE.FORM, stateTimer = 0, frame = 0;
  let wordIdx = Math.min(wordList.length - 1, Math.max(0, +new URLSearchParams(location.search).get('word') || 0));

  window.__sandDebug = { word: '', phase: 0 };
  resize();
  for (const p of particles) { p.x = Math.random() * W; p.y = Math.random() * H; }
  assignTargets();

  function draw() {
    requestAnimationFrame(draw);
    frame++;
    const t = frame * 16.7;
    const flowT = t * 0.0002;
    ctx.clearRect(0, 0, W, H);
    const wantList = (window.__dockBlend || 0) > 0.5 ? WORDS_D2 : WORDS_D3;    // 二阶段两行 / 一阶段三行
  if (wordList !== wantList) {
    wordList = wantList;
    wordIdx = wordIdx % wordList.length;
    assignTargets();
  }
  window.__sandDebug = { word: wordList[wordIdx].join(' '), phase: frame };

    switch (state) {
      case STATE.FORM: {
        stateTimer++;
        const unlocked = Math.min(activeN, stateTimer * (activeN / 45));
        const sprint = stateTimer > 60 ? 1 + (stateTimer - 60) * 0.06 : 1;
        for (let i = 0; i < activeN; i++) {
          const p = particles[i];
          if (i < unlocked) {
            const dx = p.tx - p.x, dy = p.ty - p.y;
            if (dx * dx + dy * dy < 4) { p.x = p.tx; p.y = p.ty; }  // <2px 吸附消毛边
            else {
              const curlFade = Math.max(0, 1 - stateTimer / 40);
              const wob = curlFx(p.x * 0.004, p.y * 0.004, flowT) * 0.4 * curlFade;
              const wob2 = curlFy(p.x * 0.004, p.y * 0.004, flowT) * 0.4 * curlFade;
              const e = Math.min(0.5, p.stiffness * sprint);
              p.x += dx * e + wob;
              p.y += dy * e + wob2;
            }
          }
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0.8)`;
          ctx.fillRect(p.x, p.y, p.sz * SZ_SCALE, p.sz * SZ_SCALE);
        }
        if (stateTimer > 130) { state = STATE.HOLD; stateTimer = 0; }
        break;
      }
      case STATE.HOLD: {
        stateTimer++;
        for (let i = 0; i < activeN; i++) {
          const p = particles[i];
          const bx = p.x + Math.sin(t * 0.0015 + p.stiffness * 500) * 0.6;
          const by = p.y + Math.cos(t * 0.0012 + p.stiffness * 300) * 0.5;
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0.8)`;
          ctx.fillRect(bx, by, p.sz * SZ_SCALE, p.sz * SZ_SCALE);
        }
        if (stateTimer > 75) {
          state = STATE.SCATTER; stateTimer = 0;
          for (const p of particles) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 0.4 + Math.random() * 0.8;
            p.vx = Math.cos(ang) * spd;
            p.vy = Math.sin(ang) * spd - 0.1;
          }
        }
        break;
      }
      case STATE.SCATTER: {
        stateTimer++;
        if (stateTimer === 50) { wordIdx = (wordIdx + 1) % wordList.length; assignTargets(); }
        const attractRamp = stateTimer > 65 ? Math.min(1, (stateTimer - 65) / 50) : 0;
        for (let i = 0; i < activeN; i++) {
          const p = particles[i];
          if (stateTimer > p.delay) {
            const fx = curlFx(p.x * 0.005, p.y * 0.005, flowT) * 0.8;
            const fy = curlFy(p.x * 0.005, p.y * 0.005, flowT) * 0.8;
            p.vx = p.vx * 0.96 + fx * 0.15;
            p.vy = p.vy * 0.96 + fy * 0.15;
            p.x += p.vx; p.y += p.vy;
            if (attractRamp > 0) {
              p.x += (p.tx - p.x) * p.stiffness * attractRamp;
              p.y += (p.ty - p.y) * p.stiffness * attractRamp;
              p.vx *= 0.90; p.vy *= 0.90;
            }
          }
          ctx.fillStyle = `rgba(${p.color[0]},${p.color[1]},${p.color[2]},0.8)`;
          ctx.fillRect(p.x, p.y, p.sz * SZ_SCALE, p.sz * SZ_SCALE);
        }
        if (stateTimer > 135) { state = STATE.FORM; stateTimer = 45; }
        break;
      }
    }
  }

  addEventListener('resize', () => { resize(); assignTargets(); });
  addEventListener('load', () => { resize(); assignTargets(); });
  requestAnimationFrame(draw);
})();
</script>

(() => {
  const cv = document.getElementById('bgParticles');
  const ctx = cv.getContext('2d');
  let W, H, pts = [];
  function resize() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    pts = [];
    const n = Math.min(130, innerWidth * innerHeight / 15000);
    for (let i = 0; i < n; i++)
      pts.push({ x: Math.random() * W, y: Math.random() * H, r: 0.6 + Math.random() * 1.7,
        vx: (Math.random() - 0.5) * 0.25, vy: -0.12 - Math.random() * 0.2, ph: Math.random() * 6.28 });
  }
  function tick(t) {
    requestAnimationFrame(tick);
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      if (p.x < -4) p.x = W + 4; if (p.x > W + 4) p.x = -4;
      const tw = 0.55 + 0.45 * Math.sin(t * 0.001 + p.ph);
      ctx.fillStyle = `rgba(130,200,235,${0.30 * tw})`;
      ctx.fillRect(p.x, p.y, p.r, p.r);
    }
  }
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(tick);
})();
</script>

  const hue = clamp((ndc.x + 1) * 0.5, 0, 1);
  mouseL.color.setHSL(0.52 + hue * 0.13, 0.85, 0.65);

  // 透射光晕：鼠标光在玻璃后方时，光"穿过"玻璃体 → emissive 增强
  // （鼠标未移入前 ndc 无效，保持 0，避免 V 被自发光填成色板）
  if (hasMouse) {
    const lightBehind = mouseL.position.z < vGlass.position.z;
    const distToV = mouseL.position.distanceTo(vGlass.position);
    const near = clamp(1 - distToV / 3.6, 0, 1);
    // 穿透辉光：光源在玻璃后方时光"穿"过玻璃体
    const tFactor = near * (lightBehind ? 1 : 0.3);
    vGlass.material.emissiveIntensity = 0.06 + tFactor * 2.4;   // 微底光：背光不死黑，透射色彩让路
    vGlass.material.emissive.setHSL(0.52, 0.16, 0.62);   // 近白光：真实玻璃不自带颜色
    // 彩虹油膜随光源贴近浮现（掠射出彩，正对干净）
    vGlass.material.iridescence = 0.12 + near * 0.5;
  } else {
    vGlass.material.emissiveIntensity = 0.06;
    vGlass.material.iridescence = 0.12;
  }

  if (++sandFrame % 2 === 0) sandTex.needsUpdate = true;  // 纹理 30fps 节流

  // ?perf=1：性能遥测（fps / draw calls / 三角形）——真机实测用
  if (perfEl) {
    perfFrames++;
    const pt = performance.now();
    if (pt - perfT0 >= 500) {
      perfEl.textContent = 'fps: ' + (perfFrames * 1000 / (pt - perfT0)).toFixed(0) +
        '\ndraw: ' + renderer.info.render.calls + '\ntri: ' + renderer.info.render.triangles;
      perfFrames = 0; perfT0 = pt;
    }
  }

  // 相机净零微摆（远景态呼吸）：缩得越远 / dock 越深幅度越大，输入后 2.5s 内静默。
  // 渲染前叠加、渲染后撤销——跨帧净零，setZoom 读到的永远是基础位
  {
    const zt2 = (camera.position.z - LAY.zMin) / (LAY.zMax - LAY.zMin);
    const amp = (now - lastCamInputAt > 2500) ? 0.02 + 0.055 * zt2 + 0.05 * dockBlend : 0;
    _sway.set(Math.sin(now * 0.00105) * amp, Math.sin(now * 0.00073 + 1.3) * amp * 0.6, 0);
    camera.position.add(_sway);
  }
  renderer.render(scene, camera);
  camera.position.sub(_sway);
  requestAnimationFrame(tick);
}
tick();

// resize
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  layout();
});
layout();
</script>
</body>
</html>
