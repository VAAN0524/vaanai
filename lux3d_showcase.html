<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0a0c;
    font-family:-apple-system,"PingFang SC","Songti SC",serif}

    backdrop-filter:blur(10px);transition:all .2s;white-space:nowrap}
  #tabs a.tab:hover{color:#fff;border-color:rgba(255,255,255,.5);transform:translateY(-1px)}
  #tabs .tab.act{color:#0c1220;background:rgba(235,240,248,.94);border-color:#fff;font-weight:600}

  #hero .cta:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(180,195,215,.5)}

<body>
<canvas id="gl"></canvas>
<nav id="tabs">

<div id="hero">
  <h1>流体金属<br>实时雕塑</h1>
  <p>Ray-marched morphing sculpture. Three.js 不需要——纯 GLSL fragment shader，每像素 70 步 ray-march，3D simplex noise 驱动形变。</p>
  <div class="tags">
    <span class="tag">Ray Marching</span>
    <span class="tag">Simplex Noise</span>
    <span class="tag">Fresnel</span>
    <span class="tag">Env Lighting</span>
  </div>
  <a class="cta" href="https://lux3d.aholo3d.com" target="_blank">Aholo Lux3D ↗</a>
</div>
<div id="ctrl">
  <label>Morph <input type="range" id="rMorph" min="0" max="2" step="0.01" value="1"><span id="vMorph">1.00</span></label>
  <label>Noise <input type="range" id="rNoise" min="0.3" max="3" step="0.01" value="1"><span id="vNoise">1.00</span></label>
  <label>Metal <input type="range" id="rMetal" min="0" max="1" step="0.01" value="0.8"><span id="vMetal">0.80</span></label>
</div>
<script>
/* ═══ Ray-marched Liquid Metal — ThreeUI shader 直接移植 ═══ */
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false });

const VS = 'attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.,1.);}';

const FS = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_mouse;
uniform float u_morph;
uniform float u_noise_scale;
uniform float u_metal;
uniform float u_camera;
uniform float u_mouse_amount;

#define MAX_STEPS 70
#define MAX_DIST 20.0
#define SURF_DIST 0.002

vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod(i, 289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

float map(vec3 p, float t) {
  float morph = snoise(p * (0.8 * u_noise_scale) + t * 0.1) * 0.2;
  morph += snoise(p * (1.5 * u_noise_scale) - t * 0.05 + 10.0) * 0.08;
  morph += snoise(p * (3.0 * u_noise_scale) + t * 0.02) * 0.02;
  return length(p) - 1.8 + morph * u_morph;
}

vec3 calcNormal(vec3 p, float t) {
  vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(
    map(p+e.xyy, t) - map(p-e.xyy, t),
    map(p+e.yxy, t) - map(p-e.yxy, t),
    map(p+e.yyx, t) - map(p-e.yyx, t)
  ));
}

vec3 envLighting(vec3 rd, vec2 mouse) {
  vec3 col = vec3(0.03);
  vec3 keyDir = normalize(vec3(0.5 + mouse.x, 1.0 + mouse.y * 0.5, 1.2));
  float key = pow(max(dot(rd, keyDir), 0.0), 12.0);
  col += vec3(0.95, 0.93, 0.9) * key * 1.5;
  vec3 rimDir = normalize(vec3(-0.8, -0.2, -1.0));
  float rim = pow(max(dot(rd, rimDir), 0.0), 6.0);
  col += vec3(0.4, 0.42, 0.45) * rim * 0.8;
  vec3 fillDir = normalize(vec3(-1.0, 0.5, 0.5));
  float fill = pow(max(dot(rd, fillDir), 0.0), 3.0);
  col += vec3(0.2) * fill * 0.6;
  float panel = exp(-pow((rd.y - 0.2) * 4.0, 2.0)) * smoothstep(-0.5, 0.5, rd.z);
  col += vec3(0.15) * panel;
  return col;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - u_res * 0.5) / min(u_res.x, u_res.y);
  float t = u_time * 0.8;
  vec2 m = u_mouse * u_mouse_amount;
  vec3 ro = vec3(0.0, 0.0, u_camera);
  vec3 lookAt = vec3(m.x, m.y, 0.0);
  vec3 fwd = normalize(lookAt - ro);
  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
  vec3 up = cross(fwd, right);
  vec3 rd = normalize(fwd + uv.x * right + uv.y * up);
  vec3 bgCol = mix(vec3(0.02), vec3(0.05), length(uv) * 0.5);
  vec3 col = bgCol;
  float d = 0.0;
  for (int i = 0; i < MAX_STEPS; i++) {
    vec3 p = ro + rd * d;
    float ds = map(p, t);
    d += ds;
    if (d > MAX_DIST || abs(ds) < SURF_DIST) break;
  }
  if (d < MAX_DIST) {
    vec3 p = ro + rd * d;
    vec3 n = calcNormal(p, t);
    vec3 ref = reflect(rd, n);
    float fresnel = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
    fresnel = mix(0.4, 1.0, fresnel);
    vec3 env = envLighting(ref, u_mouse);
    col = env * fresnel * 1.8 * u_metal;
    vec3 lightPos = normalize(vec3(0.5 + u_mouse.x, 1.0, 1.0));
    float spec = pow(max(dot(ref, lightPos), 0.0), 60.0);
    col += vec3(1.0) * spec * 2.0 * u_metal;
    float disp = map(p, t) - (length(p) - 1.8);
    col *= mix(0.7, 1.0, smoothstep(-0.1, 0.1, disp));
  }
  float bloom = exp(-length(uv) * 2.5);
  col += vec3(0.02) * bloom;
  col = col / (col + 0.5);
  col = pow(col, vec3(1.0 / 2.2));
  gl_FragColor = vec4(col, 1.0);
}
`;

function compile(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS))
    console.error('SHADER_COMPILE_FAIL:', gl.getShaderInfoLog(sh));
  return sh;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS))
  console.error('PROGRAM_LINK_FAIL:', gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['u_res','u_time','u_mouse','u_morph','u_noise_scale','u_metal','u_camera'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

let mx = 0, my = 0, tmx = 0, tmy = 0;
let morph = 1.0, noiseScale = 1.0, metal = 0.8, camZ = 3.5;
addEventListener('mousemove', e => {
  tmx = (e.clientX / innerWidth - 0.5) * 2;
  tmy = -(e.clientY / innerHeight - 0.5) * 2;
});
function onRes(){ gl.viewport(0, 0, cv.width = innerWidth * Math.min(devicePixelRatio,2), cv.height = innerHeight * Math.min(devicePixelRatio,2)); }
onRes(); addEventListener('resize', onRes);

// 控件绑定
document.getElementById('rMorph').addEventListener('input', e => morph = +e.target.value);
document.getElementById('rNoise').addEventListener('input', e => noiseScale = +e.target.value);
document.getElementById('rMetal').addEventListener('input', e => metal = +e.target.value);

let t = 0, last = performance.now();
function loop(now){
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  t += dt;
  mx += (tmx - mx) * 0.06; my += (tmy - my) * 0.06;
  gl.uniform2f(U.u_res, cv.width, cv.height);
  gl.uniform1f(U.u_time, t);
  gl.uniform2f(U.u_mouse, mx, my);
  gl.uniform1f(U.u_morph, morph);
  gl.uniform1f(U.u_noise_scale, noiseScale);
  gl.uniform1f(U.u_metal, metal);
  gl.uniform1f(U.u_camera, camZ);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 控件显示值同步
['rMorph','rNoise','rMetal'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    document.getElementById('v' + id.slice(1)).textContent = (+e.target.value).toFixed(2);
  });
});
</script>
</body>
</html>
