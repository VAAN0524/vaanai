<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>古董相机 · 3D 拆解</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0a0c;
    font-family:-apple-system,"PingFang SC",sans-serif}
  canvas{display:block}
  #tabs{position:fixed;top:0;left:0;right:0;z-index:98;display:flex;gap:4px;
    justify-content:center;align-items:center;padding:10px 12px 8px;
    background:linear-gradient(rgba(5,8,14,.72),rgba(5,8,14,0));pointer-events:none}
  #tabs .tab{pointer-events:auto;text-decoration:none;font-size:12.5px;
    padding:7px 15px;border-radius:999px;color:rgba(220,228,240,.72);
    background:rgba(13,18,30,.6);border:1px solid rgba(140,160,190,.2);
    backdrop-filter:blur(10px);transition:all .2s;white-space:nowrap}
  #tabs a.tab:hover{color:#fff;border-color:rgba(255,255,255,.5);transform:translateY(-1px)}
  #tabs .tab.act{color:#0c1220;background:rgba(235,240,248,.94);border-color:#fff;font-weight:600}
  #ui{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;gap:12px;align-items:center}
  .btn{padding:12px 28px;border-radius:999px;border:1px solid rgba(200,212,228,.3);
    background:rgba(20,28,40,.7);color:#e8eefc;font-size:13px;cursor:pointer;
    backdrop-filter:blur(10px);transition:all .3s;letter-spacing:.06em}
  .btn:hover{border-color:rgba(200,212,228,.6);background:rgba(30,40,56,.8)}
  .btn.act{background:#e8eefc;color:#0a0a0c;border-color:#e8eefc;font-weight:600}
  #info{position:fixed;top:80px;left:24px;z-index:10;max-width:280px}
  #info h2{font-size:1.3rem;color:#e8eefc;font-weight:700;letter-spacing:.04em}
  #info p{font-size:.82rem;color:rgba(180,195,215,.6);margin-top:.5rem;line-height:1.6}
  #loading{position:fixed;inset:0;z-index:200;background:#0a0a0c;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    transition:opacity .6s}
  #loading .txt{color:#e8b23a;font-size:14px;letter-spacing:.3em}
  #loading .bar{width:200px;height:2px;background:rgba(232,178,58,.2)}
  #loading .bar::after{content:"";display:block;height:100%;width:60%;
    background:#e8b23a;animation:ld 1.2s ease-in-out infinite}
  @keyframes ld{0%{margin-left:-60%}100%{margin-left:100%}}
  #loading.off{opacity:0;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loading"><div class="txt">LOADING</div><div class="bar"></div></div>
<div id="info"><h2>Antique Camera</h2><p>19th century folding plate camera.<br>Drag to rotate · Scroll to zoom.</p></div>
<div id="ui">
  <button class="btn act" id="btnView">360° View</button>
  <button class="btn" id="btnExplode">Explode</button>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0.5, 1.5, 4.5);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

/* 环境光照（PMREM 室内棚景——金属/玻璃 PBR 反射来源） */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* 灯光补光 */
const key = new THREE.DirectionalLight(0xfff0d2, 1.2); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x8899cc, 0.8); rim.position.set(-4, 2, -3); scene.add(rim);
const fill = new THREE.AmbientLight(0x334455, 0.3); scene.add(fill);

/* 地面 */
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48),
  new THREE.MeshStandardMaterial({ color: 0x111114, roughness: 0.9 }));
floor.rotation.x = -Math.PI/2; floor.position.y = -1.2;
floor.receiveShadow = true; scene.add(floor);

/* 加载 GLB */
const loader = new GLTFLoader();
let model = null;
const parts = [];
loader.load('models/AntiqueCamera.glb', (gltf) => {
  model = gltf.scene;
  /* 自动缩放至 ~2.5 单位高 */
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const scale = 2.5 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(scale);
  const center = box.getCenter(new THREE.Vector3()).multiplyScalar(scale);
  model.position.sub(center);
  model.position.y += size.y * scale * 0.5;
  scene.add(model);
  /* 收集所有 mesh 供爆炸用 */
  model.traverse(o => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  document.getElementById('loading').classList.add('off');
}, undefined, (err) => {
  console.error('GLB load error:', err);
  document.getElementById('loading').querySelector('.txt').textContent = 'LOAD FAILED';
});

/* 控制器 */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.5; controls.maxDistance = 12;
controls.target.set(0, 0.5, 0);

/* 爆炸图 */
let exploded = false;
const explodeMeshes = [];
const explodeOrigPos = [];
function buildExplodeMeshes() {
  if (!model) return;
  explodeMeshes.length = 0; explodeOrigPos.length = 0;
  model.updateWorldMatrix(true, true);
  model.traverse(o => {
    if (o.isMesh) {
      explodeMeshes.push(o);
      explodeOrigPos.push(o.position.clone());
    }
  });
}
function toggleExplode() {
  exploded = !exploded;
  document.getElementById('btnExplode').classList.toggle('act', exploded);
  if (!model) return;
  if (explodeMeshes.length === 0) buildExplodeMeshes();
  const sceneCenter = new THREE.Vector3();
  new THREE.Box3().setFromObject(model).getCenter(sceneCenter);
  const DIST = exploded ? 2.5 : 0;
  explodeMeshes.forEach((mesh, i) => {
    const wp = new THREE.Vector3(); mesh.getWorldPosition(wp);
    const dir = wp.clone().sub(sceneCenter);
    if (dir.length() < 0.001) dir.set(0, 1, 0);
    dir.normalize();
    mesh.userData.explodeTarget = mesh.position.clone().add(dir.multiplyScalar(DIST));
  });
  animateExplode();
}
let animId = null;
function animateExplode() {
  if (animId) cancelAnimationFrame(animId);
  let frame = 0;
  const step = () => {
    frame++;
    let moving = false;
    explodeMeshes.forEach(mesh => {
      if (!mesh.userData.explodeTarget) return;
      mesh.position.lerp(mesh.userData.explodeTarget, 0.08);
      if (mesh.position.distanceTo(mesh.userData.explodeTarget) > 0.005) moving = true;
    });
    if (moving && frame < 240) animId = requestAnimationFrame(step);
  };
  step();
}

/* UI 事件 */
document.getElementById('btnExplode').addEventListener('click', toggleExplode);
document.getElementById('btnView').addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  document.getElementById('btnView').classList.toggle('act', controls.autoRotate);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
